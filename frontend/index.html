<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Barcelona Drive</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Poppins:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0e15; }
      canvas { display: block; }

      /* ── Loading screen (shown instantly, faded out by main.js when the world is ready) ── */
      #dd-loading {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px;
        background: radial-gradient(130% 100% at 50% -5%, #1e2637, #121722 62%, #080a10);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        transition: opacity .55s ease;
      }
      #dd-loading.hide { opacity: 0; pointer-events: none; }
      #dd-loading .logo {
        width: min(460px, 74vw);
        filter: drop-shadow(0 8px 10px rgba(0,0,0,0.55));
        animation: ddBob 2.6s ease-in-out infinite;
      }
      @keyframes ddBob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
      #dd-loading .bar {
        width: min(340px, 62vw); height: 9px; border-radius: 6px;
        background: rgba(255,255,255,0.10); overflow: hidden;
      }
      #dd-loading .bar i {
        display: block; height: 100%; width: 42%; border-radius: 6px;
        background: linear-gradient(90deg, #ff5a4d, #ffd23f);
        animation: ddSlide 1.25s ease-in-out infinite;
      }
      @keyframes ddSlide { 0% { transform: translateX(-130%); } 100% { transform: translateX(360%); } }
      #dd-loading .factlabel {
        font-family: 'Lilita One', sans-serif;
        color: #ffd23f; letter-spacing: 2px; font-size: 16px;
        text-transform: uppercase; margin-top: 6px; text-shadow: 0 2px 0 rgba(0,0,0,0.3);
      }
      #dd-loading .fact {
        font-family: 'Poppins', -apple-system, sans-serif; font-weight: 500;
        max-width: min(620px, 84vw); text-align: center; color: rgba(255,255,255,0.9);
        font-size: 18px; line-height: 1.6; min-height: 58px; padding: 0 24px;
        transition: opacity .3s ease;
      }
      #dd-loading .txt {
        color: rgba(255,255,255,0.4); letter-spacing: 5px; font-size: 11.5px;
        font-weight: 600; text-transform: uppercase;
      }

      /* ── Title / start screen (shown first; PLAY drops into the game) ── */
      #dd-title {
        position: fixed; inset: 0; z-index: 10000;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px;
        background: #24406a url('/title-bg.png') center / cover no-repeat;
        transition: opacity .5s ease;
      }
      #dd-title.hide { opacity: 0; pointer-events: none; }
      #dd-title::before { content: ''; position: absolute; inset: 0;
        background: radial-gradient(circle at 50% 42%, transparent 42%, rgba(10,14,26,0.4)); }
      #dd-title .logo {
        position: relative; z-index: 1; width: min(600px, 82vw);
        filter: drop-shadow(0 10px 16px rgba(0,0,0,0.45));
        animation: ddBob 2.8s ease-in-out infinite;
      }
      #dd-title .tagline {
        position: relative; z-index: 1; font-family: 'Poppins', -apple-system, sans-serif; font-weight: 500;
        font-size: 20px; letter-spacing: 1px; color: #fff; margin-top: -6px;
        padding: 9px 26px; border-radius: 22px;
        background: rgba(14,20,36,0.5); border: 1px solid rgba(255,255,255,0.18);
        backdrop-filter: blur(4px); text-shadow: 0 1px 4px rgba(0,0,0,0.5);
      }
      #dd-title .play {
        position: relative; z-index: 1; cursor: pointer; user-select: none;
        font-family: 'Lilita One', sans-serif; font-size: 34px; letter-spacing: 3px; color: #3a2a00;
        padding: 16px 76px; border-radius: 24px; border: 3px solid rgba(0,0,0,0.18);
        background: linear-gradient(#ffe07a, #f5b32a);
        box-shadow: 0 10px 0 #c8871a, 0 16px 24px rgba(0,0,0,0.4);
        text-shadow: 0 2px 0 rgba(255,255,255,0.4);
        transition: transform .06s, box-shadow .06s; margin-top: 6px;
      }
      #dd-title .play:hover { filter: brightness(1.06); }
      #dd-title .play:active { transform: translateY(8px); box-shadow: 0 2px 0 #c8871a; }
    </style>
  </head>
  <body>
    <div id="dd-title">
      <img class="logo" src="/logo-barcelona-drive.png" alt="Barcelona Drive" />
      <div class="tagline">Cruise the streets of Barcelona</div>
      <button id="dd-play" class="play">PLAY</button>
    </div>

    <div id="dd-loading">
      <img class="logo" src="/logo-barcelona-drive.png" alt="Barcelona Drive" />
      <div class="bar"><i></i></div>
      <div class="factlabel">✦ Did you know?</div>
      <div class="fact" id="dd-fact"></div>
      <div class="txt">Loading Barcelona…</div>
    </div>

    <!-- Rotating Barcelona facts on the loading screen (runs immediately, before the JS bundle). -->
    <script>
      (function () {
        var facts = [
          "Barcelona was founded by the Romans over 2,000 years ago as “Barcino”.",
          "The Sagrada Família has been under construction since 1882 — and still isn't finished.",
          "Antoni Gaudí shaped the city: the Sagrada Família, Park Güell, Casa Batlló and La Pedrera.",
          "The Eixample's grid, with its chamfered corners, was designed by Ildefons Cerdà in 1859.",
          "Camp Nou is the largest football stadium in Europe, seating around 99,000.",
          "FC Barcelona's motto is “Més que un club” — More than a club.",
          "Barcelona hosted the 1992 Summer Olympics.",
          "The city holds 9 UNESCO World Heritage Sites.",
          "Barcelona has around 4.5 km of city beaches along the Mediterranean.",
          "La Rambla is a 1.2 km tree-lined pedestrian boulevard.",
          "Catalan and Spanish are both official languages here.",
          "Montjuïc hill overlooks the port, crowned by a 17th-century castle.",
          "Tibidabo, at 512 m, is the city's highest point — with an amusement park on top.",
          "Casa Milà (La Pedrera) famously has almost no straight lines.",
          "When finished, the Sagrada Família's central tower will reach 172.5 m.",
          "Gaudí kept the Sagrada Família just under Montjuïc's height — out of respect for nature.",
          "Barcelona is Spain's second-largest city, after Madrid.",
          "Around 5.6 million people live in the Barcelona metropolitan area.",
          "Gaudí died in 1926 after being struck by a tram.",
          "The Gothic Quarter's streets trace back to medieval — and Roman — times.",
          "Passeig de Gràcia is Barcelona's grand avenue of luxury and modernist architecture.",
          "The Magic Fountain of Montjuïc puts on light-and-music shows.",
          "La Boqueria, off La Rambla, is one of Europe's most famous food markets.",
          "Avinguda Diagonal slices across the entire city grid at an angle.",
          "Barcelona's port is one of the Mediterranean's busiest cruise hubs.",
          "La Mercè, the city's biggest festival, honours its patron saint each September.",
          "Barcelona pioneered car-free “superblocks” (superilles).",
          "The 1888 and 1929 World's Fairs both reshaped the city.",
          "Park Güell's mosaic salamander, “El Drac”, is a beloved city icon.",
          "Barcelona sits between the Collserola hills and the Mediterranean Sea.",
          "The Barcelona Metro carries over a million riders on an average day.",
          "Park Güell was originally planned as a housing estate that never sold.",
          "Gaudí is buried in the crypt of the Sagrada Família itself.",
          "Cerdà's chamfered corners — the 'xamfrans' — give every Eixample crossing a little plaza.",
          "The Columbus Monument at the foot of La Rambla points out to sea.",
          "FC Barcelona vs Real Madrid is football's famous 'El Clásico'.",
          "Camp Nou is being rebuilt into the larger 'Spotify Camp Nou'.",
          "The Palau de la Música Catalana is a UNESCO-listed modernist concert hall.",
          "The Hospital de Sant Pau is a dazzling modernist complex — also UNESCO-listed.",
          "Torre Glòries (the old Agbar Tower) glows in thousands of colours at night.",
          "Catalans build human towers called 'castells' at their festivals.",
          "Gràcia was a separate town until Barcelona absorbed it in 1897.",
          "Barcelona's beaches were largely rebuilt for the 1992 Olympics.",
          "Gaudí rarely drew full plans — he built models and shaped his buildings on site.",
          "The Bicing bike-share puts thousands of red bikes across the city.",
          "Some Barcelona metro lines run completely driverless.",
          "'Vermut' — a vermouth aperitif — is a beloved local weekend ritual.",
          "The Barri Gòtic still hides sections of the old Roman city wall.",
          "La Boqueria market has fed the city since the 13th century.",
          "The W Barcelona hotel is shaped like a giant sail on the seafront.",
          "Montjuïc means 'Jew's Mountain' — home to a medieval Jewish cemetery.",
          "Barcelona is the capital of Catalonia, in Spain's northeast.",
          "The Ronda de Dalt and Ronda Litoral ring roads loop the whole city."
        ];
        var el = document.getElementById("dd-fact");
        if (!el) return;
        var last = -1;
        function show() {
          var i; do { i = (Math.random() * facts.length) | 0; } while (i === last && facts.length > 1);
          last = i;
          el.style.opacity = 0;
          setTimeout(function () { el.textContent = facts[i]; el.style.opacity = 1; }, 250);
        }
        show();
        var t = setInterval(function () {
          if (!document.getElementById("dd-loading")) { clearInterval(t); return; }
          show();
        }, 3000);
      })();
    </script>

    <!-- Title screen: PLAY drops into the game (the game loads in the background meanwhile). -->
    <script>
      (function () {
        var title = document.getElementById('dd-title');
        var play = document.getElementById('dd-play');
        if (play) play.addEventListener('click', function () {
          title.classList.add('hide');
          setTimeout(function () { if (title) title.remove(); }, 550);
        });
      })();
    </script>

    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
